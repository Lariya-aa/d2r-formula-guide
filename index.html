<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D2R Formula Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d1a;--bg2:#13132b;--surface:#1a1a3e;--card:#1e1e4a;
  --gold:#c9a84c;--gold-dim:#8a7030;--red:#e94560;--blue:#4a6fa5;
  --green:#3a9d5e;--purple:#7b5ea7;--orange:#d4763a;
  --text:#e8e6e3;--text2:#9a98a0;--text3:#5a586a;
  --border:#2a2a5a;--glow:rgba(201,168,76,.25);
  --radius:8px;--transition:.25s cubic-bezier(.4,0,.2,1);
}
html{font-size:14px;scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC', 'Noto Sans TC', system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(201,168,76,.06) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(233,69,96,.04) 0%,transparent 50%);
}
.header{text-align:center;padding:2rem 1rem 2.5rem;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(201,168,76,.08) 0%,transparent 100%); position:relative;}
.lang-selector{position:absolute;top:1rem;right:1rem;padding:0.3rem 0.5rem;background:var(--bg2);color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;font-family:'Cinzel',serif;font-size:0.8rem;outline:none;cursor:pointer;}
.lang-selector:focus{border-color:var(--gold);box-shadow:0 0 8px var(--glow);}
.header h1{font-family:'Cinzel',serif;font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,#c9a84c 0%,#f0d890 40%,#c9a84c 60%,#8a7030 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.header .sub{color:var(--text2);font-size:.85rem;margin-top:.3rem}
.header .version{display:inline-block;margin-top:.4rem;padding:2px 10px;
  border:1px solid var(--red);border-radius:20px;color:var(--red);font-size:.7rem;font-weight:700}

.tab-nav{display:flex;justify-content:center;gap:.5rem;padding:.8rem 1rem;
  border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px); flex-wrap:wrap;}
.tab-btn{padding:.5rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius);
  background:transparent;color:var(--text2);cursor:pointer;font-size:.85rem;
  font-family:inherit;font-weight:500;transition:var(--transition)}
.tab-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.tab-btn.active{background:linear-gradient(135deg,rgba(201,168,76,.15),rgba(201,168,76,.05));
  border-color:var(--gold);color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,.15)}
.tab-panel{display:none;padding:1.2rem;max-width:1200px;margin:0 auto}
.tab-panel.active{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.section-title{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--gold);
  margin:1.2rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);letter-spacing:1px}
.rune-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.5rem}
.rune-chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;
  padding:.6rem .3rem;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;
  background:var(--surface);transition:var(--transition);user-select:none}
.rune-chip:hover{border-color:var(--gold-dim);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.rune-chip.selected{border-color:var(--gold);
  background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05));box-shadow:0 0 16px var(--glow)}
.rune-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:.75rem;color:var(--bg)}
.rune-icon.low{background:linear-gradient(135deg,#b0b0b0,#e0e0e0)}
.rune-icon.mid{background:linear-gradient(135deg,#c9a84c,#f0d890)}
.rune-icon.high{background:linear-gradient(135deg,#d4763a,#ff9a56)}
.rune-chip .rune-name{font-size:.78rem;color:var(--text);font-weight:500}
.rune-chip .rune-zh{font-size:.65rem;color:var(--text2)}
.rune-count{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--red);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;
  font-weight:700;box-shadow:0 2px 8px rgba(233,69,96,.5);opacity:0;transform:scale(0);transition:var(--transition)}
.rune-chip.selected .rune-count{opacity:1;transform:scale(1)}

.selected-bar{position:sticky;top:48px;z-index:90;background:var(--bg2);border-bottom:1px solid var(--border);
  padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;min-height:44px;backdrop-filter:blur(12px)}
.selected-bar .label{color:var(--text2);font-size:.8rem;white-space:nowrap}
.selected-bar .chips{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
.mini-chip{padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:500;
  background:rgba(201,168,76,.15);border:1px solid var(--gold-dim);color:var(--gold);cursor:pointer;
  transition:var(--transition)}
.mini-chip:hover{background:rgba(233,69,96,.2);border-color:var(--red);color:var(--red)}
.clear-btn{padding:3px 10px;border-radius:var(--radius);border:1px solid var(--red);
  background:transparent;color:var(--red);font-size:.75rem;cursor:pointer;
  transition:var(--transition);font-family:inherit}
.clear-btn:hover{background:var(--red);color:#fff}

.results-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.results-count{color:var(--text2);font-size:.85rem}
.results-count em{color:var(--gold);font-style:normal;font-weight:700}
.search-box{display:flex;align-items:center;gap:.5rem;flex:1;max-width:360px}
.search-box input{flex:1;padding:.45rem .8rem;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);color:var(--text);font-size:.85rem;outline:none;
  font-family:inherit;transition:var(--transition)}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 12px var(--glow)}
.search-box input::placeholder{color:var(--text3)}
.filter-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.filter-chip{padding:.3rem .7rem;border:1px solid var(--border);border-radius:20px;
  background:transparent;color:var(--text2);font-size:.75rem;cursor:pointer;
  transition:var(--transition);font-family:inherit}
.filter-chip:hover{border-color:var(--gold-dim)}
.filter-chip.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}

.rw-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.8rem}
.rw-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);
  overflow:hidden;transition:var(--transition)}
.rw-card:hover{border-color:var(--gold-dim);box-shadow:0 4px 24px rgba(0,0,0,.4);transform:translateY(-2px)}
.rw-card.matched{border-color:var(--gold)!important;box-shadow:0 0 20px var(--glow)!important}
.rw-card.partial{border-color:var(--blue);box-shadow:0 0 12px rgba(74,111,165,.2)}
.rw-card-head{padding:.7rem .9rem;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:linear-gradient(90deg,rgba(201,168,76,.06),transparent)}
.rw-name{font-family:'Cinzel',serif;font-weight:700;font-size:.95rem;color:var(--gold)}
.rw-loc{color:var(--text2);font-size:.8rem;margin-left:.4rem}
.rw-badge{padding:2px 8px;border-radius:12px;font-size:.65rem;font-weight:700}
.rw-badge.classic{background:rgba(107,123,141,.2);color:#6b7b8d;border:1px solid #6b7b8d}
.rw-badge.patch_2_4{background:rgba(78,205,196,.1);color:#4ecdc4;border:1px solid #4ecdc4}
.rw-badge.patch_2_6{background:rgba(69,183,209,.1);color:#45b7d1;border:1px solid #45b7d1}
.rw-badge.reign_of_warlock{background:rgba(233,69,96,.1);color:#e94560;border:1px solid #e94560}
.rw-card-body{padding:.7rem .9rem}
.rw-runes{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.rw-rune{padding:3px 8px;border-radius:4px;font-size:.75rem;font-weight:600;
  background:rgba(201,168,76,.12);color:var(--gold);border:1px solid var(--gold-dim)}
.rw-rune.owned{background:rgba(58,157,94,.2);color:var(--green);border-color:var(--green)}
.rw-rune.missing{background:rgba(233,69,96,.1);color:var(--red);border-color:rgba(233,69,96,.3);opacity:.6}
.rw-meta{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.75rem;color:var(--text2)}
.rw-meta span{display:flex;align-items:center;gap:.2rem}
.match-bar{height:3px;background:var(--border);border-radius:2px;margin-top:.5rem;overflow:hidden}
.match-bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.match-bar-fill.full{background:linear-gradient(90deg,var(--gold),#f0d890)}
.match-bar-fill.partial-f{background:linear-gradient(90deg,var(--blue),#6b9fd4)}

.recipe-group{margin-bottom:1.5rem}
.recipe-group-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);
  margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
.count-badge{padding:1px 7px;border-radius:10px;font-size:.65rem;
  background:rgba(201,168,76,.15);color:var(--gold-dim);font-family:inherit}
.recipe-card{padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--card);margin-bottom:.5rem;transition:var(--transition)}
.recipe-card:hover{border-color:var(--gold-dim);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.rc-name{font-weight:600;color:var(--text);font-size:.85rem;margin-bottom:.3rem}
.rc-formula{font-size:.8rem;color:var(--gold);padding:.4rem .6rem;
  background:rgba(201,168,76,.06);border-radius:4px;margin-bottom:.3rem;border-left:3px solid var(--gold-dim)}
.rc-result{font-size:.78rem;color:var(--green)}
.rc-notes{font-size:.72rem;color:var(--text3);margin-top:.2rem;font-style:italic}
.craft-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.4rem}
.craft-table th{text-align:left;padding:.4rem .5rem;color:var(--gold);font-weight:600;
  border-bottom:1px solid var(--border)}
.craft-table td{padding:.35rem .5rem;border-bottom:1px solid rgba(42,42,90,.5);color:var(--text2)}
.craft-table tr:hover td{background:rgba(201,168,76,.03)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty-state .icon{font-size:3rem;margin-bottom:.8rem;opacity:.4}

.base-layout{display:flex;gap:1.5rem;align-items:flex-start}
.base-sidebar{width:200px;display:flex;flex-direction:column;gap:0.3rem;flex-shrink:0}
.base-cat-btn{text-align:left;padding:0.6rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);cursor:pointer;font-size:0.85rem;transition:var(--transition)}
.base-cat-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.base-cat-btn.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.base-content{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;overflow-x:auto}
.base-table{width:100%;border-collapse:collapse;font-size:0.85rem;text-align:left}
.base-table th{padding:0.6rem;color:var(--gold);border-bottom:1px solid var(--border);white-space:nowrap}
.base-table td{padding:0.6rem;border-bottom:1px solid rgba(42,42,90,.5);color:var(--text)}
.base-table tr:hover td{background:rgba(201,168,76,.05)}
.tier-Normal{color:#9a98a0}
.tier-Exceptional{color:#4a6fa5}
.tier-Elite{color:#c9a84c}

@media(max-width:768px){
  .base-layout{flex-direction:column}
  .base-sidebar{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:0.5rem}
  .base-cat-btn{white-space:nowrap}
}
@media(max-width:640px){
  .rune-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .rw-list{grid-template-columns:1fr}
  .tab-nav{gap:.3rem}.tab-btn{padding:.4rem .7rem;font-size:.78rem}
  .header h1{font-size:1.4rem}
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}

/* ── Tooltip System ── */
#tooltip{
  position:fixed;z-index:9999;pointer-events:none;
  background:linear-gradient(135deg,#1a1a3e 0%,#0d0d1a 100%);
  border:1px solid var(--gold);border-radius:var(--radius);
  padding:.8rem 1rem;max-width:320px;min-width:200px;
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 20px var(--glow);
  font-size:.8rem;line-height:1.5;opacity:0;
  transition:opacity .15s ease;display:none;
}
#tooltip.visible{opacity:1;display:block}
#tooltip .tt-title{
  font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;
  color:var(--gold);margin-bottom:.5rem;padding-bottom:.4rem;
  border-bottom:1px solid var(--border);
}
#tooltip .tt-stat{color:var(--text);margin:.2rem 0}
#tooltip .tt-stat.blue{color:#4a6fa5}
#tooltip .tt-stat.gold{color:#c9a84c}
#tooltip .tt-stat.green{color:#3a9d5e}
#tooltip .tt-stat.red{color:#e94560}
#tooltip .tt-meta{color:var(--text2);font-size:.72rem;margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--border)}
#tooltip .tt-icon{float:right;width:40px;height:40px;border-radius:4px;margin-left:.8rem;background:var(--surface);border:1px solid var(--border)}

/* ── Match Preview ── */
#matchPreview{
  display:none;margin:1rem 0;padding:.8rem;
  background:var(--card);border:1px solid var(--gold-dim);
  border-radius:var(--radius);
}
#matchPreview.visible{display:block;animation:fadeUp .25s ease}
#matchPreview h3{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold);margin-bottom:.6rem}
.match-prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.5rem}
.match-prev-card{
  display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;
  border:1px solid var(--border);border-radius:4px;background:var(--surface);
  transition:var(--transition);
}
.match-prev-card:hover{border-color:var(--gold-dim)}
.match-prev-card.full{border-color:var(--gold);background:rgba(201,168,76,.08)}
.match-prev-icon{width:32px;height:32px;border-radius:4px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--text3)}
.match-prev-info{flex:1;min-width:0}
.match-prev-name{font-size:.8rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-prev-runes{font-size:.68rem;color:var(--text2);display:flex;gap:.2rem;flex-wrap:wrap;margin-top:.15rem}
.match-prev-rune-owned{color:var(--green)}
.match-prev-rune-missing{color:var(--red)}
.match-prev-badge{font-size:.6rem;padding:1px 5px;border-radius:8px;margin-left:auto;align-self:flex-start}
.match-prev-badge.full{background:rgba(201,168,76,.2);color:var(--gold)}
.match-prev-badge.partial{background:rgba(74,111,165,.15);color:var(--blue)}

/* ── Item Icons on RW Cards ── */
.rw-card{display:flex;flex-direction:row}
.rw-card-icon{width:56px;min-height:56px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:.4rem;font-size:1.8rem;color:var(--text3);opacity:.35;flex-wrap:wrap;gap:2px}
.rw-icon-rune{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:.6rem;color:var(--bg);flex-shrink:0}
.rw-icon-rune.low{background:linear-gradient(135deg,#b0b0b0,#e0e0e0)}
.rw-icon-rune.mid{background:linear-gradient(135deg,#c9a84c,#f0d890)}
.rw-icon-rune.high{background:linear-gradient(135deg,#d4763a,#ff9a56)}
.rw-icon-rune-overlay{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:900;font-size:.5rem;color:var(--bg);flex-shrink:0;border:1px solid rgba(0,0,0,.3)}
.rw-icon-rune-overlay.low{background:linear-gradient(135deg,#b0b0b0,#e0e0e0)}
.rw-icon-rune-overlay.mid{background:linear-gradient(135deg,#c9a84c,#f0d890)}
.rw-icon-rune-overlay.high{background:linear-gradient(135deg,#d4763a,#ff9a56)}
.rw-card-content{flex:1;min-width:0}
.rw-card-head{flex-wrap:wrap}

/* ── Recipe Sidebar Layout ── */
.recipe-layout{display:flex;gap:1.5rem;align-items:flex-start}
.recipe-sidebar{width:200px;display:flex;flex-direction:column;gap:0.3rem;flex-shrink:0}
.recipe-cat-btn{text-align:left;padding:0.6rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);cursor:pointer;font-size:0.85rem;transition:var(--transition)}
.recipe-cat-btn:hover{border-color:var(--gold-dim);color:var(--text)}
.recipe-cat-btn.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.recipe-content{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.recipe-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.6rem}
.recipe-card{padding:.7rem .9rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:var(--transition)}
.recipe-card:hover{border-color:var(--gold-dim);box-shadow:0 2px 12px rgba(0,0,0,.3)}
.rc-name{font-weight:600;color:var(--text);font-size:.85rem;margin-bottom:.3rem}
.rc-formula{font-size:.8rem;color:var(--gold);padding:.4rem .6rem;background:rgba(201,168,76,.06);border-radius:4px;margin-bottom:.3rem;border-left:3px solid var(--gold-dim)}
.rc-result{font-size:.78rem;color:var(--green)}
.rc-notes{font-size:.72rem;color:var(--text3);margin-top:.2rem;font-style:italic}
.craft-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.4rem}
.craft-table th{text-align:left;padding:.4rem .5rem;color:var(--gold);font-weight:600;border-bottom:1px solid var(--border)}
.craft-table td{padding:.35rem .5rem;border-bottom:1px solid rgba(42,42,90,.5);color:var(--text2)}
.craft-table tr:hover td{background:rgba(201,168,76,.03)}
.recipe-crafting-section{margin-top:1.5rem}
.recipe-crafting-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--gold);margin:.8rem 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}

/* ── Base Item Icons ── */
.base-item-icon{width:28px;height:28px;vertical-align:middle;margin-right:.4rem;image-rendering:auto}
.base-item-icon-wrap{display:inline-block;width:28px;height:28px}
.base-table td .base-name-cell{display:flex;align-items:center;gap:.4rem}
</style>
</head>
<body>
<div class="header">
  <select class="lang-selector" id="langSelect">
    <option value="sc">简体中文</option>
    <option value="tc">繁體中文</option>
    <option value="en">English</option>
  </select>
  <h1>D2R Formula Guide</h1>
  <div class="sub" id="ui-subtitle">暗黑破坏神2：重制版 — 合成公式助手</div>
  <span class="version">v3.1 Reign of the Warlock</span>
  <div class="global-search" id="globalSearchWrap" style="display:none;position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);width:90%;max-width:500px;z-index:200">
    <input type="text" id="globalSearchInput" placeholder="全局搜索 / Global Search…" style="width:100%;padding:.5rem 1rem;border:1px solid var(--gold);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;box-shadow:0 4px 20px rgba(0,0,0,.5)">
    <div id="globalSearchResults" style="position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--gold);border-radius:var(--radius);margin-top:4px;max-height:400px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.6);display:none;z-index:201"></div>
  </div>
</div>
<nav class="tab-nav">

// ──── TOOLTIP SYSTEM ────
function showTooltip(html, event) {
  const tt = document.getElementById('tooltip');
  tt.innerHTML = html;
  tt.classList.add('visible');
  positionTooltip(event);
}

function positionTooltip(event) {
  const tt = document.getElementById('tooltip');
  const padding = 12;
  let x = event.clientX + padding;
  let y = event.clientY + padding;
  const rect = tt.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  if (x + rect.width > vw - padding) x = event.clientX - rect.width - padding;
  if (y + rect.height > vh - padding) y = event.clientY - rect.height - padding;
  if (y < padding) y = padding;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// ──── RENDER RUNES ────
function renderRunes(){
  const g=document.getElementById('runeGrid');
  if(!RUNES.length) return;
  g.innerHTML=RUNES.map(r=>{
    const c=inv[r.name_en]||0;
    const dispName = getPropName(r, 'name');
    return`<div class="rune-chip${c?' selected':''}" oncontextmenu="decRune(event,'${r.name_en}')" onclick="addRune('${r.name_en}')">
<div class="rune-count">${c}</div>
<div class="rune-icon ${tier(r.id)}">${r.id}</div>
<div class="rune-name">${r.name_en}</div>
<div class="rune-zh">${dispName}</div></div>`;
  }).join('');
}

function addRune(n){inv[n]=(inv[n]||0)+1;refresh()}
function decRune(e,n){e.preventDefault();if(inv[n]>0){inv[n]--;if(!inv[n])delete inv[n]}refresh()}

// ──── SELECTED BAR ────
function updateBar(){
  const chips=document.getElementById('selectedChips');
  const cb=document.getElementById('clearBtn');
  const e=Object.entries(inv).filter(([,v])=>v>0);
  if(!e.length){
    chips.innerHTML=`<span style="color:var(--text3);font-size:.78rem">${getText('empty_bag')}</span>`;
    cb.style.display='none';return;
  }
  cb.style.display='block';
  chips.innerHTML=e.map(([n,c])=>`<span class="mini-chip" onclick="decRune(event,'${n}')">${n}${c>1?' ×'+c:''}</span>`).join('');
}
document.getElementById('clearBtn').onclick=()=>{Object.keys(inv).forEach(k=>delete inv[k]);refresh()};

// ──── MATCH PREVIEW ────
function renderMatchPreview(){
  const mp = document.getElementById('matchPreview');
  const grid = document.getElementById('matchPrevGrid');
  if(!mp || !grid) return;

  document.getElementById('ui-match-title').innerText = getText('match_preview');

  const hasInv = Object.values(inv).some(v => v > 0);
  if(!hasInv || !RUNEWORDS.length){
    mp.classList.remove('visible');
    return;
  }

  mp.classList.add('visible');

  // Calculate matches
  const matches = RUNEWORDS.map(rw => ({...rw, m: calcM(rw)}))
    .filter(rw => rw.m.pct > 0)
    .sort((a, b) => b.m.pct - a.m.pct);

  if(matches.length === 0){
    grid.innerHTML = `<div style="color:var(--text3);font-size:.8rem;text-align:center;padding:1rem">${getText('no_match')}</div>`;
    return;
  }

  grid.innerHTML = matches.slice(0, 12).map(rw => {
    const n_en = rw.name_en || rw.name;
    const n_loc = getPropName(rw, 'name');
    const bases = currentLang === 'en' ? rw.base_types : (currentLang === 'tc' ? rw.base_types_tc : rw.base_types_sc);
    const isFull = rw.m.pct === 1;
    const pct = Math.round(rw.m.pct * 100);

    const used = {};
    const runesStr = rw.runes.map(r => {
      used[r] = (used[r] || 0) + 1;
      const have = (inv[r] || 0) >= used[r];
      return `<span class="${have ? 'match-prev-rune-owned' : 'match-prev-rune-missing'}">${r}</span>`;
    }).join('');

    // Show first 3 runes as icon
    const runesIconHtml = rw.runes.slice(0, 3).map(r => {
      const tierClass = RUNES.find(rn => rn.name_en === r);
      const tierClassName = tierClass ? tier(tierClass.id) : 'low';
      return `<div class="rw-icon-rune ${tierClassName}" style="width:28px;height:28px;font-size:.7rem">${r}</div>`;
    }).join('');

    return `<div class="match-prev-card ${isFull ? 'full' : ''}"
      onmouseenter="showTooltip(buildRwTooltip('${n_en.replace(/'/g, "\\'")}'), event)"
      onmousemove="positionTooltip(event)"
      onmouseleave="hideTooltip()">
      <div class="match-prev-icon" style="flex-wrap:wrap;gap:2px">${runesIconHtml}</div>
      <div class="match-prev-info">
        <div class="match-prev-name">${n_en}</div>
        <div class="match-prev-runes">${runesStr}</div>
      </div>
      <span class="match-prev-badge ${isFull ? 'full' : 'partial'}">${isFull ? getText('match_full') : pct + '%'}</span>
    </div>`;
  }).join('');
}

function buildRwTooltip(name) {
  const rwData = RW_STATS[name];
  let stats = [];
  if (Array.isArray(rwData)) {
    stats = rwData;
  } else if (rwData && typeof rwData === 'object') {
    stats = rwData[currentLang] || rwData.en || [];
  }
  const n_loc = getPropName({name_en: name, name_sc: name, name_tc: name}, 'name');
  let html = `<div class="tt-title">${n_loc}</div>`;
  stats.forEach(s => {
    const cls = s.startsWith('+') ? 'blue' : (s.includes(' Aura') || s.includes('Resistance') || s.includes('抗性') || s.includes('光環') ? 'gold' : '');
    html += `<div class="tt-stat ${cls}">${s}</div>`;
  });
  return html;
}

// ──── RENDER RUNEWORDS ────
function calcM(rw){
  const need={};
  rw.runes.forEach(r=>need[r]=(need[r]||0)+1);
  let total=rw.runes.length,owned=0;
  for(const[r,c]of Object.entries(need)) owned+=Math.min(inv[r]||0,c);
  return{total,owned,pct:total?owned/total:0,need};
}

function renderRW(){
  const list=document.getElementById('rwList');
  const cntEl=document.getElementById('resultsCount');
  const q=searchQ.toLowerCase().trim();
  const hasInv=Object.values(inv).some(v=>v>0);

  if(!RUNEWORDS.length) return;

  let items=RUNEWORDS.filter(rw=>{
    const n_en = (rw.name_en || rw.name || "").toLowerCase();
    const n_loc = getPropName(rw, 'name');
    if(q && !n_en.includes(q) && !n_loc.includes(q)) return false;
    if(activeFilter!=="全部"){
      const bt = rw.base_types || [];
      if(!bt.some(t=>t===activeFilter||t.includes(activeFilter))) return false;
    }
    return true;
  }).map(rw=>({...rw,m:calcM(rw)}));

  if(hasInv) items.sort((a,b)=>b.m.pct!==a.m.pct?b.m.pct-a.m.pct:b.level_req-a.level_req);

  const full=items.filter(i=>i.m.pct===1).length;
  let cntStr = getText('total_rw').replace('{0}', `<em>${items.length}</em>`);
  if(hasInv) cntStr += getText('full_match').replace('{0}', `<em>${full}</em>`);
  cntEl.innerHTML=cntStr;

  if(!items.length){list.innerHTML=`<div class="empty-state"><div class="icon">🔍</div><p>${getText('no_match')}</p></div>`;return}

  list.innerHTML=items.map(rw=>{
    const m=rw.m;
    const cls=m.pct===1?'matched':m.pct>0?'partial':'';
    const used={};
    const runesH=rw.runes.map(r=>{
      used[r]=(used[r]||0)+1;
      const have=(inv[r]||0)>=used[r];
      const c=hasInv?(have?'owned':'missing'):'';
      return`<span class="rw-rune ${c}">${r}</span>`;
    }).join('');

    // Loc logic
    const n_en = rw.name_en || rw.name;
    const n_loc = getPropName(rw, 'name');
    const bases = currentLang === 'en' ? rw.base_types : (currentLang==='tc'?rw.base_types_tc:rw.base_types_sc);
    const baseZh = (bases || rw.base_types || []).join(' / ');
    const pct=Math.round(m.pct*100);

    // Show base item icon with runes overlay
    const iconCode = RW_ICONS[n_en] || 'inv';
    const iconUrl = `https://diablo2.io/styles/zulu/theme/images/items/${iconCode}_ticon.png`;
    const runesOverlayHtml = rw.runes.slice(0, 4).map(r => {
      const tierClass = RUNES.find(rn => rn.name_en === r);
      const tierClassName = tierClass ? tier(tierClass.id) : 'low';
      return `<div class="rw-icon-rune-overlay ${tierClassName}">${r}</div>`;
    }).join('');

    const iconHtml = `<img src="${iconUrl}" alt="${n_en}" style="width:100%;height:100%;object-fit:contain;position:absolute;top:0;left:0;z-index:1" onerror="this.style.display='none'">
      <div style="position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:1px;justify-content:center;align-items:center;width:100%;height:100%">${runesOverlayHtml}</div>`;

    return`<div class="rw-card ${cls}">
<div class="rw-card-icon" style="position:relative;overflow:hidden" onmouseenter="showTooltip(buildRwTooltip('${n_en.replace(/'/g, "\\'")}'), event)" onmousemove="positionTooltip(event)" onmouseleave="hideTooltip()">${iconHtml}</div>
<div class="rw-card-content">
<div class="rw-card-head"><div><span class="rw-name">${n_en}</span><span class="rw-loc">${n_loc!==n_en?n_loc:''}</span></div>
<span class="rw-badge ${rw.category}">${CATS[rw.category]||rw.patch}</span></div>
<div class="rw-card-body"><div class="rw-runes">${runesH}</div>
<div class="rw-meta"><span>🔲 ${getText('sockets').replace('{0}',rw.sockets)}</span><span>📦 ${baseZh}</span><span>⭐ ${getText('req_lv').replace('{0}',rw.level_req)}</span>
${hasInv?`<span>✅ ${m.owned}/${m.total}</span>`:''}</div>
${hasInv?`<div class="match-bar"><div class="match-bar-fill ${m.pct===1?'full':'partial-f'}" style="width:${pct}%"></div></div>`:''}</div></div></div>`;
  }).join('');
}

// ──── GLOBAL SEARCH ────
let globalSearchVisible = false;
const globalSearchBtn = document.getElementById('globalSearchBtn');
const globalSearchWrap = document.getElementById('globalSearchWrap');
const globalSearchInput = document.getElementById('globalSearchInput');
const globalSearchResults = document.getElementById('globalSearchResults');

globalSearchBtn.addEventListener('click', () => {
  globalSearchVisible = !globalSearchVisible;
  globalSearchWrap.style.display = globalSearchVisible ? 'block' : 'none';
  if (globalSearchVisible) {
    globalSearchInput.focus();
  } else {
    globalSearchInput.value = '';
    globalSearchResults.style.display = 'none';
  }
});

globalSearchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    globalSearchResults.style.display = 'none';
    return;
  }
  performGlobalSearch(q);
});

function performGlobalSearch(q) {
  const results = [];
  const tabs = [];

  // Search runes
  RUNES.forEach(r => {
    if (r.name_en.toLowerCase().includes(q) || getPropName(r, 'name').includes(q)) {
      results.push({ type: 'rune', name: r.name_en, match: getPropName(r, 'name'), tab: 'materials' });
    }
  });

  // Search runewords
  RUNEWORDS.forEach(rw => {
    const n_en = rw.name_en || rw.name;
    const n_loc = getPropName(rw, 'name');
    if (n_en.toLowerCase().includes(q) || n_loc.includes(q)) {
      results.push({ type: 'runeword', name: n_en, match: n_loc, tab: 'runewords' });
    }
  });

  // Search recipes
  Object.keys(RECIPES).forEach(catKey => {
    const cat = RECIPES[catKey];
    if (cat.recipes) {
      cat.recipes.forEach(r => {
        const n = getPropName(r, 'name');
        if (n.includes(q) || getPropName(r, 'formula').includes(q)) {
          results.push({ type: 'recipe', name: n, match: getPropName(r, 'formula'), tab: 'recipes', cat: getPropName(cat, 'description') });
        }
      });
    }
    if (cat.types) {
      cat.types.forEach(t => {
        const n = getPropName(t, 'type');
        if (n.includes(q)) {
          results.push({ type: 'crafting', name: n, match: cat.description, tab: 'recipes', cat: getPropName(cat, 'description') });
        }
      });
    }
  });

  // Search base items
  Object.keys(BASE_ITEMS).forEach(cat => {
    (BASE_ITEMS[cat] || []).forEach(item => {
      const n = getPropName(item, 'name');
      if (n.includes(q) || item.name_en.toLowerCase().includes(q)) {
        results.push({ type: 'baseitem', name: n, match: item.name_en, tab: 'baseitems', cat: cat });
      }
    });
  });

  renderGlobalSearchResults(results.slice(0, 20));
}

function renderGlobalSearchResults(results) {
  if (results.length === 0) {
    globalSearchResults.innerHTML = `<div style="padding:1rem;color:var(--text3);text-align:center">${getText('no_match')}</div>`;
    globalSearchResults.style.display = 'block';
    return;
  }
  globalSearchResults.innerHTML = results.map(r => {
    const icon = r.type === 'rune' ? '🔮' : r.type === 'runeword' ? '⚔️' : r.type === 'recipe' ? '📜' : '🛡️';
    return `<div class="gs-result" style="padding:.6rem 1rem;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem" onclick="goToGlobalResult('${r.tab}', '${r.cat || ''}')">
      <span style="font-size:1.2rem">${icon}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:.85rem;color:var(--text);font-weight:500">${r.name}</div>
        <div style="font-size:.72rem;color:var(--text2)">${r.match}</div>
      </div>
      <span style="font-size:.65rem;color:var(--text3)">${r.tab === 'materials' ? '符文' : r.tab === 'runewords' ? '符文之语' : r.tab === 'recipes' ? '公式' : '底材'}</span>
    </div>`;
  }).join('');
  globalSearchResults.style.display = 'block';
}

function goToGlobalResult(tab, cat) {
  switchTab(tab);
  if (tab === 'recipes' && cat) {
    setTimeout(() => setActiveRecipeCat(cat), 100);
  }
  if (tab === 'baseitems' && cat) {
    setTimeout(() => setBaseCat(cat), 100);
  }
  globalSearchInput.value = '';
  globalSearchResults.style.display = 'none';
  globalSearchVisible = false;
  globalSearchWrap.style.display = 'none';
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  document.getElementById('panel-' + tabId).classList.add('active');
}

// Fix: setActiveRecipeCat should exist
let activeRecipeCat = '';
function setActiveRecipeCat(cat) {
  activeRecipeCat = cat;
  renderRecipes();
}

// ──── REFRESH ALL ────
function refresh(){
  renderFilters();
  renderRunes();
  updateBar();
  renderMatchPreview();
  renderRW();
  renderRecipes();
  renderBaseCategories();
}

// ──── LOAD DATA & BOOT ────
async function boot(){
  localizeUI();
  try{
    const[rwRes, rcRes, rRes, biRes]=await Promise.all([
      fetch('data/runewords.json'), fetch('data/cube_recipes.json'),
      fetch('data/runes.json'), fetch('data/base_items.json')
    ]);
    RUNEWORDS = await rwRes.json();
    RECIPES = await rcRes.json();
    RUNES = await rRes.json();
    BASE_ITEMS = await biRes.json();
  }catch(e){
    console.warn('Fetch failed, check if running via HTTP server:',e);
  }
  refresh();
}
boot();
</script>
